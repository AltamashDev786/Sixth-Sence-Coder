<!DOCTYPE html>
<html>
<head>
    <title>Student Login - Sixth Sence Coder</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        * { margin:0; padding:0; box-sizing:border-box; font-family: Arial, sans-serif; }
        body { background: linear-gradient(135deg, #667eea, #764ba2); height:100vh; display:flex; justify-content:center; align-items:center; }
        .card { background:white; padding:40px; border-radius:15px; width:380px; box-shadow:0 10px 25px rgba(0,0,0,0.2); }
        h1 { text-align:center; margin-bottom:25px; color:#333; }
        p { margin:10px 0 5px; font-weight:bold; color:#555; }
        input { width:100%; padding:12px; border:1px solid #ddd; border-radius:8px; outline:none; }
        button { width:100%; margin-top:20px; padding:12px; background:#667eea; color:white; border:none; border-radius:8px; font-size:16px; cursor:pointer; }
        button:hover { background:#5a6fd6; }
        .link { text-align:center; margin-top:15px; }
        .link a { color:#667eea; text-decoration:none; font-weight:bold; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Student Login</h1>
        <form action="/login" method="POST">
            <p>Email:</p>
            <input type="email" name="email" required placeholder="Enter your email">
            <p>Password:</p>
            <input type="password" name="password" required placeholder="Enter password">
            <button type="submit">Login</button>
        </form>
        <p class="link">New user? <a href="/register">Sign Up</a></p>
    </div>
</body>
</html>
