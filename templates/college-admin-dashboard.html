<!DOCTYPE html>
<html>
<head>

        </div>
        <div class="card mt-4 p-4 shadow">
            <h5 class="fw-bold">Quick Actions</h5>
            <div class="d-flex gap-2 mt-3">
                <a href="#" class="btn btn-primary">Generate NEP Report</a>
                <a href="#" class="btn btn-dark">View Analytics</a>

        </div>
