<!DOCTYPE html>
<html>
<head>
    <title>College Admin Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: linear-gradient(to bottom right, #2563eb, #1e40af); min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .login-card { background: white; border-radius: 20px; padding: 40px; width: 100%; max-width: 450px; box-shadow: 0 20px 40px rgba(0,0,0,0.2); }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="text-center mb-4">
            <h4 class="fw-bold text-primary">SixSense Coders</h4>
            <h3 class="fw-bold">College Admin Login</h3>
            <small class="text-muted">Manage Placements & Analytics</small>
        </div>
        <form method="POST" action="/college-admin/login">
            <div class="mb-3">
                <label>College Email ID</label>
                <input type="email" name="email" class="form-control p-3" placeholder="admin@college.edu" required>
            </div>
            <div class="mb-3">
                <label>Password</label>
                <input type="password" name="password" class="form-control p-3" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn btn-primary w-100 p-3 fw-bold">Admin Login</button>
        </form>
        <p class="text-center text-muted small mt-3">Dashboard • Analytics • NEP Report</p>
    </div>
</body>
</html>
