<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Company Login</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            padding: 40px 15px;
        }

        .container {
            max-width: 450px;
            margin: auto;
        }

        .box {
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.10);
        }

        h1 {
            text-align: center;
            margin-bottom: 8px;
            color: #222;
        }

        .subtitle {
            text-align: center;
            color: #777;
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 7px;
            font-weight: bold;
            color: #333;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #ccc;
            border-radius: 7px;
            font-size: 15px;
            outline: none;
        }

        input:focus {
            border-color: #00a6ff;
            box-shadow: 0 0 0 2px rgba(0, 166, 255, 0.10);
        }

        .error {
            background: #ffe5e5;
            color: #c62828;
            padding: 12px;
            border-radius: 7px;
            margin-bottom: 20px;
            text-align: center;
            font-weight: bold;
        }

        .login-btn {
            width: 100%;
            margin-top: 25px;
            padding: 14px;
            background: #00a6ff;
            color: white;
            border: none;
            border-radius: 7px;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        .login-btn:hover {
            background: #008ed6;
        }

        .register {
            text-align: center;
            margin-top: 22px;
            color: #666;
        }

        .register a {
            color: #008ed6;
            font-weight: bold;
            text-decoration: none;
        }

        .register a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="box">

            <h1>Company Login</h1>

            <p class="subtitle">
                Login to your Company Panel
            </p>

            <!-- Error Message -->
            {% if error %}
            <div class="error">
                {{ error }}
            </div>
            {% endif %}

            <form method="POST">

                <label>
                    Company Email
                </label>

                <input type="email" name="email" placeholder="company@example.com" required>


                <label>
                    Password
                </label>

                <input type="password" name="password" placeholder="Enter your password" required>


                <button type="submit" class="login-btn">
                    Login to Company Panel
                </button>

            </form>


            <div class="register">

                Don't have a company account?

                <a href="/company/register">
                    Register Your Company
                </a>

            </div>

        </div>

    </div>

</body>

</html>
