<!DOCTYPE html>
<html>
<head>
    <title>Student Registration</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        * { margin:0; padding:0; box-sizing:border-box; font-family: Arial, sans-serif; }
        body { background: linear-gradient(135deg, #667eea, #764ba2); min-height:100vh; display:flex; justify-content:center; align-items:center; padding:20px; }
        .card { background:white; padding:35px; border-radius:15px; width:400px; box-shadow:0 10px 25px rgba(0,0,0,0.2); }
        h1 { text-align:center; margin-bottom:20px; color:#333; }
        label { display:block; margin:12px 0 5px; font-weight:bold; color:#555; font-size:14px; }
        input { width:100%; padding:11px; border:1px solid #ddd; border-radius:8px; outline:none; }
        button { width:100%; margin-top:20px; padding:12px; background:#667eea; color:white; border:none; border-radius:8px; font-size:16px; cursor:pointer; }
        .link { text-align:center; margin-top:15px; }
        .link a { color:#667eea; text-decoration:none; font-weight:bold; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Student Registration</h1>
        <form method="POST" action="/register" enctype="multipart/form-data">
            <label>Name:</label>
            <input type="text" name="name" required placeholder="Enter full name">
            <label>Email:</label>
            <input type="email" name="email" required placeholder="Enter email">
            <label>Password:</label>
            <input type="password" name="password" required placeholder="Create password">
            <label>Resume:</label>
            <input type="file" name="resume" accept=".pdf,.doc,.docx">
            <button type="submit">Register</button>
        </form>
        <p class="link">Already have account? <a href="/login">Login</a></p>
    </div>
</body>
</html>
